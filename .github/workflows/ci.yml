name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - name: Format check
        run: test -z "$(gofmt -l main.go agent.go)"
      - name: Build and vet
        run: |
          go build -o /tmp/realm-panel main.go
          go build -o /tmp/realm-agent agent.go
          go vet main.go
          go vet agent.go
      - name: Shell syntax and lint
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n install_panel.sh install_agent.sh
          shellcheck install_panel.sh install_agent.sh
